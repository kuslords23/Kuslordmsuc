name: Music Mega Batch 002 Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/music-mega-002-player-bridge]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Verify MUSIC-MEGA-001 contracts
        run: npm run verify:music
      - name: Verify MUSIC-MEGA-002 player and bridge
        run: npm run verify:music:mega-002
      - name: Build standalone music app
        run: npm run build
