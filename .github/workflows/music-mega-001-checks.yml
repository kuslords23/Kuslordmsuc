name: Music Mega Batch Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [music-mega-001-scn-port]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Verify music integration contracts
        run: npm run verify:music
      - name: Build standalone app
        run: npm run build
