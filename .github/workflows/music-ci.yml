name: Kus-Lords Music CI

on:
  push:
    branches: [main]

concurrency:
  group: kus-music-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify:royal-companion
      - run: npm run verify:music
      - run: npm run typecheck
      - run: npm run build
